worker_processes  auto;
pid               /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Keep all writable paths under /tmp so the container FS can stay read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  30;
    server_tokens   off;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types        text/plain text/css application/javascript image/svg+xml application/json;

    # Cache policy, set once at server level (an add_header inside a location
    # would silently drop every security header below).
    # File names are not versioned, so everything is revalidated (cheap 304 via
    # ETag) and a new deploy shows up immediately, in browsers and in the CDN.
    # Only the fonts, which never change, are cached for good.
    map $uri $cache_control {
        ~*\.woff2?$  "public, max-age=31536000, immutable";
        default      "no-cache";
    }

    server {
        listen       8080;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # Security headers (no inline-blocking CSP issues: the app uses external files).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # The camera is only ever used by this page: frames are composed in the
        # browser and nothing is uploaded (connect-src 'none').
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Cache-Control $cache_control always;
        add_header Content-Security-Policy "default-src 'none'; manifest-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'none'; base-uri 'self'; form-action 'none'" always;

        # Liveness / readiness endpoint for Kubernetes probes.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # No upload endpoint exists: refuse any request body outright.
        client_max_body_size 1k;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
